---
layout: default
---
<header class="page-header">
  <div class="container">
    {%- if page.eyebrow -%}
      <div class="eyebrow">{{ page.eyebrow }}</div>
    {%- endif -%}
    <h1 class="page-title">{{ page.title | escape }}</h1>
    {%- if page.subtitle -%}
      <p class="page-lead">{{ page.subtitle | escape }}</p>
    {%- endif -%}
  </div>
</header>

<div class="page-body">
  <div class="container">
    {{ content }}
  </div>
</div>
