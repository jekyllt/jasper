# =============================================================================
# Radar Mine Monitoring article: placeholder definitions + DUMMY DATA
# -----------------------------------------------------------------------------
# Single source of truth for every map, chart, image and table on
# radar-mine-monitoring/index.md. The page refers to entries by ID only.
#
# To swap a placeholder for the real thing:
#   1. put the file under assets/images/radar/
#   2. set  image: assets/images/radar/<file>  on the entry
#   3. set  status: final
# All numbers below are FICTIONAL and exist only to test the layout.
# =============================================================================

concession:
  name: "Concession KN-07"            # fictional
  holder: "PT Contoh Nikel (fictional)"
  licence: "IUP Operasi Produksi"
  commodity: "Nickel"
  region: "Central Sulawesi"
  licensed_area_ha: 1850
  report_month: "October 2026"
  history_from: "2017"

# --- KPI panel (K1) ----------------------------------------------------------
kpis:
  id: K1
  source: "O6 concession monthly statistics"
  owner: "Nasir"
  tiles:                              # (named 'tiles', not 'items', to avoid clashing with built-in methods)
    - label: "Mine footprint"
      value: "642 ha"
      note: "34.7% of licensed area"
    - label: "Actively worked"
      value: "251 ha"
      note: "39% of footprint, last 60 days"
    - label: "Dormant > 6 months"
      value: "273 ha"
      note: "11 openings"
    - label: "New this month"
      value: "14.6 ha"
      note: "3 new openings"
    - label: "Outside boundary"
      value: "6.2 ha"
      note: "2 locations, to verify"
    - label: "Change vs last month"
      value: "+2.3%"
      note: "footprint growth"

# --- Figures -------------------------------------------------------------------
# type: map | chart | image | diagram     ratio: CSS aspect-ratio (w/h)
# width: normal | wide                     status: placeholder | draft | final
figures:
  - id: F1
    type: image
    width: wide
    ratio: "21/9"
    title: "Same day, same concession: optical vs radar"
    shows: "Split view. Left: a Sentinel-2 image of the concession hidden under cloud. Right: the Sentinel-1 radar image from the same week, pits and roads clearly visible."
    source: "Sentinel-2 + Sentinel-1 scenes of the pilot concession"
    owner: "Nasir"
    status: placeholder
    caption: "Cloud hides the mine from optical satellites for weeks at a time. Radar does not care."

  - id: F2
    type: chart
    width: normal
    ratio: "16/9"
    title: "Usable optical days vs radar passes, per month"
    shows: "Grouped bars for the last 12 months: number of cloud-free optical observations vs number of Sentinel-1 passes. Wet-season months show optical near zero, radar steady."
    source: "O1 radar coverage table + Sentinel-2 cloud statistics"
    owner: "Nasir"
    status: placeholder
    caption: "In the wet season, optical imagery often gives you nothing. Radar keeps counting."

  - id: F3
    type: diagram
    width: wide
    ratio: "21/7"
    title: "How it works, in four steps"
    shows: "Four boxes left to right: 1 Map the mine (land cover + mine mask) → 2 Watch every opening (radar change test each pass) → 3 Turn pixels into decisions (hectares, dates, status) → 4 Check our own work (validation, confidence)."
    source: "Design only, no data dependency"
    owner: "Web"
    status: placeholder
    caption: "Machine learning tells us where the mine is. Radar tells us what is happening inside it, and when."

  - id: F4
    type: map
    width: wide
    ratio: "16/9"
    title: "Land cover and mine mask"
    shows: "Concession boundary (WIUP) over a land-cover map: active pit / bare ground, waste and tailings, roads and infrastructure, water, vegetation, revegetation. Legend with hectares per class."
    source: "O2 land cover map, O3 mine mask"
    owner: "Nasir"
    status: placeholder
    caption: "Step 1: the land-cover model draws the mine footprint that all radar analysis works inside."

  - id: F5
    type: map
    width: wide
    ratio: "16/9"
    title: "Activity status of every opening"
    shows: "Footprint coloured by status: active (last 60 days), recently inactive (60–180 days), dormant (> 180 days), new this month. Opening IDs labelled."
    source: "O4 activity status map"
    owner: "Nasir"
    status: placeholder
    caption: "Only part of the footprint is actually being worked. This map shows which part."

  - id: F6
    type: map
    width: normal
    ratio: "4/3"
    title: "When each opening started"
    shows: "Openings coloured by first detected change date (sequential colour ramp from 2017 to 2026). Openings that started before the recorded permit date carry a marker."
    source: "O5 change timing rasters + WIUP permit dates"
    owner: "Nasir"
    status: placeholder
    caption: "A start date for every opening, independent of any internal record."

  - id: F7
    type: map
    width: normal
    ratio: "4/3"
    title: "Disturbance beyond the concession boundary"
    shows: "Zoomed inset at each location where disturbance extends beyond the WIUP boundary, with area in hectares and a recent image underneath."
    source: "O3 mine mask + WIUP boundary"
    owner: "Nasir"
    status: placeholder
    caption: "Flagged for verification, before anyone outside the company finds it."

  - id: F8
    type: chart
    width: normal
    ratio: "16/9"
    title: "Activity through the seasons"
    shows: "Monthly active area (ha) over 24 months, wet-season months shaded. A rainfall line on a secondary axis is optional."
    source: "O4 activity status, O5 change timing"
    owner: "Nasir"
    status: placeholder
    caption: "Does the rain really stop work? Now you can see it month by month."

  - id: F9
    type: chart
    width: wide
    ratio: "21/9"
    title: "Footprint growth since 2017"
    shows: "Cumulative footprint (area chart) with monthly new disturbance (bars) on top. The current month is highlighted."
    source: "O6 concession monthly statistics"
    owner: "Nasir"
    status: placeholder
    caption: "A growth story ready for the board."

  - id: F10
    type: chart
    width: normal
    ratio: "16/9"
    title: "Ponds and settling basins"
    shows: "Water area per pond over the last 12 months; fill and drain events marked."
    source: "O7 pond / water dynamics"
    owner: "Nasir"
    status: placeholder
    caption: "Ponds that swell in the wet season are worth watching."

  - id: F11
    type: image
    width: wide
    ratio: "21/9"
    title: "Raw radar vs corrected radar"
    shows: "Three panels of the same hillside: raw Sentinel-1 (speckled, slopes bright and dark from geometry), after terrain correction, after speckle filtering. The pit edge only becomes readable in the third panel."
    source: "Sentinel-1 preprocessing chain (S1 stage)"
    owner: "Nasir"
    status: placeholder
    caption: "The data is free. Making it readable is the work."

  - id: F12
    type: image
    width: normal
    ratio: "3/4"
    title: "Your monthly briefing"
    shows: "Mock-up of page 1 of the monthly briefing: headline findings, KPI panel, small activity map, questions for your team."
    source: "Report template (in progress)"
    owner: "Web"
    status: placeholder
    caption: "One page to read before the meeting. The detail sits behind it."

